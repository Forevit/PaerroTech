<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1650" viewBox="0 0 880 1650" role="img" aria-labelledby="title desc">
<title id="title">Fluxo do script de padronização corporativa</title>
<desc id="desc">Execução de arquivo PowerShell com elevação, validação da retomada, nove etapas e confirmação de hostname e domínio após reinício.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172033}.node{fill:#f8fafc;stroke:#334155;stroke-width:2}.decision{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.good{fill:#ecfdf5;stroke:#047857;stroke-width:2}.bad{fill:#fef2f2;stroke:#b91c1c;stroke-width:2}.edge{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}.label{font-size:15px}.small{font-size:13px;fill:#475569}</style></defs>
<rect width="880" height="1650" fill="#fff"/>
<text x="440" y="40" text-anchor="middle" font-size="24" font-weight="700">Padronização de Máquinas — fluxo auditado</text>
<rect class="node" x="250" y="65" width="380" height="62" rx="16"/><text x="440" y="92" text-anchor="middle" font-size="17">Inicia .ps1 existente</text><text class="small" x="440" y="113" text-anchor="middle">caminho validado para elevação e retomada</text>
<path class="edge" d="M440 127V160"/><path class="edge" d="M440 225V258"/>
<rect class="decision" x="280" y="160" width="320" height="65" rx="10"/><text x="440" y="188" text-anchor="middle" font-size="17">É administrador?</text><text class="small" x="440" y="210" text-anchor="middle">UAC com -File; falha encerra com erro</text>
<rect class="node" x="280" y="258" width="320" height="65" rx="10"/><text x="440" y="286" text-anchor="middle" font-size="17">Carrega log e estado persistidos</text><text class="small" x="440" y="308" text-anchor="middle">RunId e arquivo de log continuam após reboot</text>
<path class="edge" d="M440 323V350"/>
<rect class="decision" x="270" y="350" width="340" height="75" rx="10"/><text x="440" y="380" text-anchor="middle" font-size="17">Há ação pendente de reboot?</text><text class="small" x="440" y="403" text-anchor="middle">valida hostname e, quando pedido, domínio real</text>
<path class="edge" d="M440 425V455"/><rect class="good" x="270" y="455" width="340" height="58" rx="10"/><text x="440" y="490" text-anchor="middle" font-size="16">Confirma etapa 3 somente após validação</text>
<path class="edge" d="M440 513V548"/><rect class="node" x="270" y="548" width="340" height="58" rx="10"/><text x="440" y="583" text-anchor="middle" font-size="16">1. Conta interna RID-500 (interativa)</text>
<path class="edge" d="M440 606V630"/><rect class="node" x="270" y="630" width="340" height="58" rx="10"/><text x="440" y="665" text-anchor="middle" font-size="16">2. Internet, edição Windows e Office</text>
<path class="edge" d="M440 688V712"/><rect class="decision" x="245" y="712" width="390" height="85" rx="10"/><text x="440" y="742" text-anchor="middle" font-size="16">3. Hostname e domínio opcional</text><text class="small" x="440" y="766" text-anchor="middle">DNS SRV → resolve DC → TCP/389 e TCP/445</text><text class="small" x="440" y="785" text-anchor="middle">registra ação pendente antes de renomear/ingressar</text>
<path class="edge" d="M440 797V825"/><rect class="good" x="270" y="825" width="340" height="66" rx="10"/><text x="440" y="851" text-anchor="middle" font-size="15">RunOnce !Padronizacao + reboot</text><text class="small" x="440" y="873" text-anchor="middle">próximo logon interativo valida o estado real</text>
<path class="edge" d="M610 857H750V386H610"/><text class="small" x="755" y="620" transform="rotate(-90 755 620)">Retomada após logon</text>
<path class="edge" d="M440 891V922"/><rect class="node" x="270" y="922" width="340" height="58" rx="10"/><text x="440" y="957" text-anchor="middle" font-size="16">4. Windows Update em primeiro plano</text>
<path class="edge" d="M440 980V1004"/><rect class="node" x="270" y="1004" width="340" height="58" rx="10"/><text x="440" y="1039" text-anchor="middle" font-size="16">5. Aplicativos via WinGet</text>
<path class="edge" d="M440 1062V1086"/><rect class="node" x="270" y="1086" width="340" height="58" rx="10"/><text x="440" y="1121" text-anchor="middle" font-size="16">6. GLPI Agent opcional</text>
<path class="edge" d="M440 1144V1168"/><rect class="node" x="270" y="1168" width="340" height="58" rx="10"/><text x="440" y="1203" text-anchor="middle" font-size="16">7. Microsoft 365 Apps e detecção posterior</text>
<path class="edge" d="M440 1226V1250"/><rect class="node" x="270" y="1250" width="340" height="58" rx="10"/><text x="440" y="1285" text-anchor="middle" font-size="16">8. Drivers do fabricante opcionais</text>
<path class="edge" d="M440 1308V1332"/><rect class="node" x="270" y="1332" width="340" height="58" rx="10"/><text x="440" y="1367" text-anchor="middle" font-size="16">9. Ativação manual pelos canais oficiais</text>
<path class="edge" d="M440 1390V1420"/><rect class="good" x="270" y="1420" width="340" height="62" rx="16"/><text x="440" y="1458" text-anchor="middle" font-size="17">Resumo final e limpeza do estado</text>
<rect class="bad" x="30" y="475" width="190" height="120" rx="10"/><text x="125" y="505" text-anchor="middle" font-size="15">Validação falhou</text><text class="small" x="125" y="532" text-anchor="middle">erro no log</text><text class="small" x="125" y="554" text-anchor="middle">estado preservado</text><text class="small" x="125" y="576" text-anchor="middle">retomar manualmente</text><path class="edge" d="M270 388H220V475"/>
<text class="small" x="440" y="1530" text-anchor="middle">Avisos de etapas opcionais ficam no log; falhas críticas interrompem o fluxo.</text>
</svg>
